<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>stage 1c mutation runner</title></head>
<body>
<h1>段階1c 不具合注入（mutations_1c.json）</h1>
<p>studio_state.js の文字列に置き換えを1つずつ加え、test_1c_cases.js と test_1b_cases.js を実行する。不合格が1件以上なら KILLED、0件なら SURVIVED。find が1回だけ現れなければ PATTERN_ERROR。</p>
<pre id="out">running…</pre>
<script src="parse_v2.js"></script>
<script src="test_1b_cases.js"></script>
<script src="test_1c_cases.js"></script>
<script>
'use strict';
const text = async p => { const r = await fetch(p, { cache: 'no-store' }); if (!r.ok) throw new Error(p + ' HTTP ' + r.status); return r.text(); };
const sha256 = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, '0')).join('');
const load = src => { const g = { ParseV2 }; new Function('globalThis', src)(g); return g.StudioState; };
(async () => {
  const out = { startedAt: new Date().toISOString() };
  try {
    const [src, mutText, casesSrc] = await Promise.all([text('studio_state.js'), text('mutations_1c.json'), text('test_1c_cases.js')]);
    out.files = { studio_state: await sha256(src), mutations_1c: await sha256(mutText), test_1c_cases: await sha256(casesSrc) };
    const both = S => run1c(S).concat(run1b(S)); const base = both(load(src)); out.baseline = { total: base.length, fail: base.filter(r => !r.ok).length };
    out.mutants = JSON.parse(mutText).mutants.map(m => {
      const n = src.split(m.find).length - 1;
      if (n !== 1) return { id: m.id, name: m.name, result: 'PATTERN_ERROR', occurrences: n };
      let r; try { r = both(load(src.replace(m.find, () => m.replace))); } catch (e) { return { id: m.id, name: m.name, result: 'KILLED', note: 'load error ' + e }; }
      const f = r.filter(x => !x.ok);
      return { id: m.id, name: m.name, result: f.length ? 'KILLED' : 'SURVIVED', failing: [...new Set(f.map(x => x.test.split(' ')[0]))] };
    });
    out.summary = { killed: out.mutants.filter(m => m.result === 'KILLED').length, survived: out.mutants.filter(m => m.result === 'SURVIVED').length, patternErrors: out.mutants.filter(m => m.result === 'PATTERN_ERROR').length, total: out.mutants.length };
  } catch (e) { out.error = String(e); }
  out.finishedAt = new Date().toISOString();
  window.__MUT1C__ = out;
  document.getElementById('out').textContent = JSON.stringify(out, null, 2);
})();
</script>
</body>
</html>
