<h1>段階1b 状態規則の試験（studio_state.js）</h1>
<p>受入条件 A-01〜A-12 のうち、データと規則で確かめられる部分を試験データで確かめる。画面の確認は別に行う。外部通信なし。</p>
<pre id="out">running…</pre>
<script src="parse_v2.js"></script>
<script src="studio_state.js"></script>
<script src="test_1b_cases.js"></script>
<script>
'use strict';
const results = run1b(StudioState);
const pass = results.filter(r => r.ok).length;
const out = { total: results.length, pass, fail: results.length - pass, failures: results.filter(r => !r.ok), tests: [...new Set(results.map(r => r.test))].map(n => ({ test: n, checks: results.filter(r => r.test === n).length, fail: results.filter(r => r.test === n && !r.ok).length })) };
window.__T1B__ = out;
document.getElementById('out').textContent = JSON.stringify(out, null, 2);
</script>
