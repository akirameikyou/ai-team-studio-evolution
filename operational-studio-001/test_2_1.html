<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>stage 2-1 packet tests</title></head>
<body>
<h1>段階2-1 依頼文の試験（前提資料の本文）</h1>
<p>依頼文づくり（studio_packets.js の観測・統合・実行タスク）を試験用の Case で直接呼び、本文の資料が全文そのまま入ることを確かめる。
app.js は読み込まない。ブラウザの保存領域（localStorage）には触れないことも確かめる。外部通信なし。</p>
<pre id="out">running…</pre>
<script>
// Count every access to the browser storage made after this point: the modules under test must not use it.
window.__storageCalls = [];
for (const m of ['getItem', 'setItem', 'removeItem', 'clear']) {
  const orig = Storage.prototype[m];
  Storage.prototype[m] = function (...a) { window.__storageCalls.push(m); return orig.apply(this, a); };
}
</script>
<script src="connectors.js"></script>
<script src="parse_v2.js"></script>
<script src="studio_state.js"></script>
<script src="studio_text.js?v=2-2c"></script>
<script src="studio_packets.js?v=2-4"></script>
<script>
'use strict';
(async () => {
  const results = []; let cur = null;
  const check = (cond, msg) => results.push({ test: cur, ok: !!cond, msg });
  const NL = String.fromCharCode(10);
  const hex = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join('');
  const now = () => new Date().toISOString();
  const P = StudioPackets;

  const body = ['前提の一行目', '', '空行の後の行', '  行頭に空白のある行', '--- S9 ここまで ---（本文中の紛らわしい行）', '最後の行'].join(NL);
  const src = StudioText.textSource('S1', '試験の前提', body, await hex(body), new TextEncoder().encode(body).length, now());
  const fields = { OBSERVATION: '観測', EVIDENCE: 'INFERENCE', UNKNOWN: 'なし', CONDITION: '試験', SOURCE_ACCESS: 'S1=READABLE' };
  const c = {
    id: 'CASE-TEST-21', question: '試験の問い', createdAt: now(), sources: [src, { id: 'S2', kind: 'URL', ref: 'https://example.com/x', claimedHash: null, verified: null, access: {} }],
    observers: ['GPT', 'Codex'], tasks: {
      GPT: { taskId: 'CASE-TEST-21-OBS-GPT', sentAt: now(), sendStatus: null, result: { fields, raw: '原文' } },
      Codex: { taskId: 'CASE-TEST-21-OBS-Codex', sentAt: now(), sendStatus: null, result: { fields, raw: '原文' } } },
    synthesis: { fields: { COMMON: '共通', NEXT_TASK: '作業', EXECUTION_NEEDS: '条件', UNKNOWN: '不明', HOLD: '' }, by: 'GPT', at: now(), raw: 'x', missing: [] },
    gate: { decision: 'APPROVE', at: now(), reason: '理由' }, gateHistory: [], next: null, metrics: {}, log: [], requests: []
  };
  const packets = { observe: P.observe(c, 'GPT'), synthesis: P.synthesis(c, 'GPT'), next: P.next(c, 'Codex', 'CASE-TEST-21-NEXT') };

  cur = 'P-00 準備';
  check(!src.error && src.verified && src.verified.sha256 === await hex(body), '本文の資料ができ、ハッシュは本文の SHA-256');
  check(typeof window.observePacket === 'undefined' && typeof window.render === 'undefined', 'app.js は読み込んでいない');

  for (const [name, p] of Object.entries(packets)) {
    cur = 'P-01 ' + name + ' の依頼文';
    check(p.includes(NL + body + NL), '本文が全文そのまま入る（空行・行頭の空白・紛らわしい行を含む）');
    check(p.includes('- S1｜本文｜試験の前提｜Studio が保存した本文 SHA-256 ' + src.verified.sha256), '資料の一覧に名前とハッシュ');
    check(p.includes('--- S1「試験の前提」 SHA-256 ' + src.verified.sha256 + ' ---' + NL + body + NL + '--- S1 ここまで ---'), '区切りの中に本文');
    check(p.includes('https://example.com/x'), 'ほかの資料（URL）も一覧に残る');
    const start = p.indexOf('--- S1「試験の前提」'), inner = p.slice(p.indexOf(NL, start) + 1, p.lastIndexOf(NL + '--- S1 ここまで ---'));
    check(await hex(inner) === src.verified.sha256, '依頼文から取り出した本文のハッシュが記録と一致');
  }

  cur = 'P-02 本文の資料がないとき';
  const c0 = { ...c, sources: [c.sources[1]] };
  check(!P.observe(c0, 'GPT').includes('■ 資料本文'), '本文の資料がなければ「資料本文」の区切りは出ない');

  cur = 'P-03 統合に観測本文を含める';
  const resultRaw = '前置きの具体的な回答本文\n[STUDIO_RESULT]\nOBSERVATION: 結果ブロック内の重複\n[/STUDIO_RESULT]\n後置きの本文\n[STUDIO_SYNTHESIS] は回答本文中の文字列';
  c.tasks.GPT.result.raw = resultRaw;
  let syn = P.synthesis(c, 'GPT');
  check(syn.includes('前置きの具体的な回答本文\n') && syn.includes('後置きの本文\n[STUDIO_SYNTHESIS] は回答本文中の文字列'), '採用観測の結果ブロック外にある本文が統合依頼に入る');
  check(!syn.includes('結果ブロック内の重複'), '回答本文から最後の [STUDIO_RESULT] ブロックが取り除かれる');
  check(syn.includes('#### GPT の回答本文（') && syn.includes('コードフェンス内の [STUDIO_RESULT] や [STUDIO_SYNTHESIS]'), '回答本文の見出しとブロックの注意書きが入る');

  cur = 'P-04 バッククォートを含む本文';
  c.tasks.GPT.result.raw = '本文に ``` がある';
  syn = P.synthesis(c, 'GPT');
  check(syn.includes('````\n本文に ``` がある\n````'), '本文中のバッククォートより長いフェンスで囲む');

  cur = 'P-05 本文の上限';
  c.tasks.GPT.result.raw = 'A'.repeat(30005);
  syn = P.synthesis(c, 'GPT');
  check(syn.includes('#### GPT の回答本文（30005字）') && syn.includes('A'.repeat(30000)), '見出しに全文字数を示し、本文は先頭30,000字まで');
  check(syn.includes('（以下 5 字を省略。全文はスタジオの記録にある）'), '上限超過分の文字数と記録先を注記する');
  check(!syn.includes('A'.repeat(30001)), '本文の出力上限を超えない');

  cur = 'P-06 空の回答本文';
  c.tasks.GPT.result.raw = '  \n[STUDIO_RESULT]\nOBSERVATION: 項目だけ\n[/STUDIO_RESULT]  ';
  syn = P.synthesis(c, 'GPT');
  check(syn.includes('#### GPT の回答本文（0字）\n（本文なし）'), '本文が空なら見出しの後に本文なしと表示する');

  cur = 'P-07 不採用観測の本文';
  const cWithIneligible = { ...c, observers: [...c.observers, 'Nope'], tasks: { ...c.tasks, Nope: { taskId: 'NOPE', result: { status: 'PARSE_FAILED', fields, raw: '不採用観測の秘密本文' } } } };
  syn = P.synthesis(cWithIneligible, 'GPT');
  check(!syn.includes('不採用観測の秘密本文'), '不採用の観測は本文ごと統合依頼に入らない');

  cur = 'P-09 時刻はパソコンの現地時刻で表示する（世界標準時の文字列を切り出さない）';
  const local = (y, mo, d, h, mi) => new Date(y, mo - 1, d, h, mi, 30).toISOString();   // stored as UTC, like now()
  check(P.hm(local(2026, 10, 25, 9, 5)) === '10-25 09:05', '朝 9:05 は 09:05（' + P.hm(local(2026, 10, 25, 9, 5)) + '）');
  check(P.hm(local(2026, 1, 1, 0, 7)) === '01-01 00:07', '年の変わり目の 0:07 は 01-01 00:07（' + P.hm(local(2026, 1, 1, 0, 7)) + '）');
  check(P.hm('') === '' && P.hm(null) === '' && P.hm(undefined) === '', '空の値は空のまま');
  check(P.hm('2026-13-99T99:99') === '13-99 99:99', '日時として読めない値は、今までどおり切り出す');
  const cg = { ...c, gate: { ...c.gate, at: local(2026, 10, 25, 9, 5) } };
  check(P.next(cg, 'Codex', 'CASE-TEST-21-NEXT').includes('■ 人間の判断: APPROVE（10-25 09:05）'), '実行タスクの依頼文の判断の時刻も現地時刻');
  if (new Date(2026, 9, 25).getTimezoneOffset() === 0) check(false, 'このパソコンは世界標準時なので、P-09 は直す前と後の違いを見分けられない（別のタイムゾーンで実行する）');

  cur = 'P-08 保存領域に触れない';
  check(window.__storageCalls.length === 0, '依頼文づくりの間、localStorage を一度も使っていない（' + window.__storageCalls.join(',') + '）');

  const pass = results.filter(r => r.ok).length;
  const out = { total: results.length, pass, fail: results.length - pass, failures: results.filter(r => !r.ok) };
  window.__T21__ = out;
  document.getElementById('out').textContent = JSON.stringify(out, null, 2);
})();
</script>
</body>
</html>
